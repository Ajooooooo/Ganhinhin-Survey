<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		What is your name?
		<input id='name' type='text'>
		Your program?
		<input id='program' type='text'>
		Your year level?
		<input id='level' type='text'>
		Your department?
		<input id='department' type='text'>
		Your organization
		<input id='organization' type='text'>
		Your achievements?
		<input id='achievements' type='text'>
		Motto in life?
		<input id='motto' type='text'>
		Favorite subject?
		<input id='fav_sub' type='text'>
		Best moments during freshman year?
		<input id='moment' type='text'>
		Any extracurricular activity?
		<input id='extra_act' type='text'>

		<button type="button" onclick="clickButton( document.getElementById('name?').value ,document.getElementById('program').value ,document.getElementById('level').value ,document.getElementById('department').value ,document.getElementById('organization').value ,document.getElementById('achievements').value ,document.getElementById('motto').value ,document.getElementById('fav_sub').value ,document.getElementById('moment').value ,document.getElementById('extra_act').value)">Click Me!</button>

		<script>


		const user = 'qwer';
		const pass = '1234'


		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			const postData = {
				name:a,
				prog:b,
				YL:c,
				dept:d,
				org:e,
				achieve:f,
				motto:g,
				fs:h,
				bmdfy:i,
				ea:j
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
